<style>
/* Used to blur non-hint elements, when entered into hint mode */
@keyframes hint_overlay_fade_in {
	0% {
		opacity: 0;
	}
	100% {
		opacity: 1;
	}
}

@keyframes hint_overlay_fade_out {
	0% {
		opacity: 1;
	}
	100% {
		opacity: 0;
	}
}

.hint_overlay_fade_in {
	background: rgb(0 0 0 / 30%);

	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;

	backdrop-filter: blur(10px) sepia(1) brightness(0.5);

	/* Soft appearence */
	animation: hint_overlay_fade_in 0.3s ease-out forwards;
}

.hint_overlay_fade_out {
	animation: hint_overlay_fade_out 0.3s ease-in forwards;
}

/* Badge, when pressed by user - enters hint mode */
@keyframes hint_badge {
	0% {
		transform: rotateY(0deg) translateY(0px);
		filter: drop-shadow(2px 4px 6px orange);
	} 50% {
		transform: rotateY(0deg) translateY(-5px);
		filter: drop-shadow(0px 0px 0px orange);
	} 100% {
		transform: rotateY(0deg) translateY(0px);
		filter: drop-shadow(2px 4px 6px orange);
	}
}

.hint_badge {
	position: fixed;
	top: 0em;
	right: 0em;
	padding: 0;
	font-size: 2em;
	user-select: none;

	animation-name: hint_badge;
	animation-iteration-count: infinite;
	animation-duration: 2s;
	animation-timing-function: linear;
}

/* Every element to be hinted is considered a hint target.
   Should not be used standalone, as it depends on hint tool implementation */
@keyframes hint_target {
	0% {
		transform: scale(1);
	} 100% {
		transform: scale(0.75);
	}
}

.hint_target {
	box-shadow: 0 0 1em rgba(32, 255, 0, 0.8);

	transform: scale(0.75);

	/* Apply the initial scaling animation */
	animation: hint_target 0.5s ease-out 0s;

	/* For hover: Transition properties for smooth changes */
	transition: box-shadow 0.5s ease-in-out, transform 0.3s ease-out;
}

.hint_target:hover {
	transform: scale(1.0);
	box-shadow: 0 0 1.5em rgba(32, 255, 0, 1);
}

<script>
class hint_tool {
	/** Unique identifier */
	constructor(uid) {
		this.uid = uid;
	}

	/** Active overlay */
	overlay = undefined;
}

/** Attaches hint to the element, click action may be specified */
hint_tool.prototype.register = function (element, click_action) {
	/* This elements now containts "hint dataset element" */
	element.dataset["hint_" + this.uid] = "";

	element["hint_action_" + this.uid] = click_action;
}

/** Creates a cloned element which mimics original element
    appearence and position, but lies within another parent.
    The original element is hidden unless delete() method is called.
    The impostor element is not linked with the original, thus any
    updates won"t be transfered after one has been created. */
hint_tool.prototype.impostor_create = function (element, parent) {
	/* 1. Store original visibility style to restore later */
	const original_visibility = element.style.visibility;

	/* 2. Clone the original element (deep clone to include children) */
	const cloned = element.cloneNode(true);

	/* 3. Hide the original element (preserving its space in the layout) */
	element.style.visibility = "hidden";

	/* 4. Remove any ID to prevent duplicate IDs in the DOM */
	cloned.removeAttribute("id");

	/* 5. Append the clone to the specified target parent */
	parent.appendChild(cloned);

	/* 6. Track original element position */
	const position_tracker = setInterval(function() {
		const rect = element.getBoundingClientRect();
		cloned.style.top = rect.top + "px";
		cloned.style.left = rect.left + "px";

		cloned.style.position  = "fixed";
		cloned.style.width  = `${rect.width}px`;
		cloned.style.height = `${rect.height}px`;
		cloned.style.margin = 0;
	}, 0);


	/* 7. Return an object with the remove and a reference to the clone */
	return {
		element: cloned,

		remove: function() {
			cloned.parentNode.removeChild(cloned);

			/* Restore the original element"s visibility */
			element.style.visibility = original_visibility;

			/* Stop position tracker */
			clearInterval(position_tracker);
		}
	};
}

/** Enters hint mode. Finds all element containing data-hint field,
    and makes them a hint target */
hint_tool.prototype.overlay_enable = function (parent) {
	if (this.overlay) return; /* Already enabled */

	this.overlay = document.createElement("div");
	this.overlay.className = "hint_overlay_fade_in";
	parent.appendChild(this.overlay);

	/* Create impostor for each data-hint_ item */
	document.querySelectorAll("[data-hint_" + this.uid + "]").forEach(item => {
		item.impostor = this.impostor_create(item, parent);

		if (item.classList.contains("hint_custom")) {
			/* Do not set any actions or styles on custom hints */
		} else {
			item.impostor.element.onclick = item["hint_action_" + this.uid];
			item.impostor.element.classList.add("hint_target");
		}

		/* Impostor should not have hint property
		   This prevents from false enumeration when removing hints */
		delete item.impostor.element.dataset["hint_" + this.uid];
	});
}

/** Return everything to normal */
hint_tool.prototype.overlay_disable = function () {
	/* Remove all impostors */
	document.querySelectorAll("[data-hint_" + this.uid + "]").forEach((item, index) => {
		item.impostor.remove();
		delete item.impostor;
	});

	this.overlay.classList.add("hint_overlay_fade_out");
	this.overlay.addEventListener("animationend", () => {
		if (this.overlay.parentNode) {
			this.overlay.parentNode.removeChild(this.overlay);
		}

		delete this.overlay;
	});
}

/** Toggles hint on and off */
hint_tool.prototype.overlay_toggle = function (parent) {
	if (this.overlay == undefined) {
		this.overlay_enable(parent);
	} else {
		this.overlay_disable();
	}
}

/** Hint badge created at the top right screen corner */
hint_tool.prototype.badge_create = function hint_badge_create(parent) {
	const badge = document.createElement("div");

	/* Custom hints can not have any actions or hint_target style applied
	   by default */
	badge.classList.add("hint_custom", "hint_badge");

	/* "..." dialog badge */
	badge.innerHTML = "&#128172"
	parent.appendChild(badge);

	/* Badge becomes a valid hint target */
	badge.dataset["hint_" + this.uid] = "";

	badge.onclick = () => {
		this.overlay_enable(parent);

		/* "Overlay_enable" creates impostor for all hint targets,
		    including badge element (see above) */
		badge.impostor.element.onclick = () => {
			this.overlay_disable();
		}
	}

	return badge;
}
</script>

<script>
class ajax {
	/** Object network id. */
	#id;
	set id(id) { this.#id = id; this.on_id_change(id); }
	get id() { return this.#id; }
		
	/** Send array of args. Example: send([1, "test", "hello"]); */
	send(args)
	{
		if (this.#id == undefined)
			return;
		
		/** Example of generated request: /?id=0&a1=1&a2=test&a3=hello. */
		var request = "/?id=" + encodeURIComponent(this.#id);
		for (var i = 0; i < args.length; i++) {
			request += "&a" + (i + 1) + "="
				+ encodeURIComponent(args[i]);
		}
		
		/** Log URI if we're running this page standalone. */
		if(window.location.protocol == 'file:') {
			console.log("send|    " + request);
			return;
		}
		
		/** Create XMLHTTP request. */
		const xhttp = new XMLHttpRequest();
		xhttp.sender = this;
		
		/** What to do on response. */
		xhttp.onload = function()
		{
			if (this.responseText.length <= 0)
				return;

			var args;

			console.log("recv|    " + request);
			try {
				args = JSON.parse(this.responseText);
			} catch (e) {
				args = [];
			}

			xhttp.sender.on_recv(args);
		}

		xhttp.open("GET", request, true);
		xhttp.send();
	}
	
	/** Auto send interval. */
	#interval = 0;
	#interval_timer;
	
	set interval(value)
	{
		this.#interval = value;
		clearInterval(this.#interval_timer);
		if (value <= 0) return;
		
		this.#interval_timer = setInterval(
			() => { this.on_interval(); },
			this.#interval
		);
	}
	
	get interval() { return this.#interval; }
	
	/** Callbacks. */
	on_recv(args) {	 }
	on_interval(args) { this.send([]); }
	on_id_change(id) { this.send([]); }
}

function generic_create(parent, class_name)
{
	const g = document.createElement("div");
	g.className = class_name;
	parent.appendChild(g);
	
	g.ajax = new ajax();

	return g;
}

function layout_create(parent, direction)
{	
	const layout = generic_create(parent, "lay");
	layout.style.flexDirection = (direction == "h") ? "row" : "column";
	return layout;
}

function pane_create(parent, caption)
{	
	const pane = generic_create(parent, "pane");
	
	pane.caption = generic_create(pane, "pane_capt");
	pane.text = generic_create(pane.caption, "pane_text");
	pane.text.innerHTML = caption;
	pane.toolbar = generic_create(pane.caption, "pane_tool");
	
	pane.content = generic_create(pane, "pane_cont");
	
	return pane;
}

function subpane_create(parent, caption)
{
	const pane = pane_create(parent, caption);
	//pane.style.boxShadow = "none";
	pane.text.style.fontSize = "1em";
	return pane;
}

function popup_create(parent, caption) {
	const blur = generic_create(parent, "blur");
	const popup = pane_create(blur, caption);
	popup.classList.add("popup");
	
	blur.caption = popup.caption;
	blur.content = popup.content;
	
	return blur;
};

function text_create(parent, text)
{
	const e = generic_create(parent, "text");
	e.innerHTML = text;
	return e;
}

function button_create(parent, text)
{
	var button = generic_create(parent, "button");
	button.innerHTML = text;
	
	/** custom event. */
	button.on_press = function() {}
	
	/** Set ajax event for this checkbox. */
	button.onclick = function()
	{
		this.on_press();
		this.ajax.send([1]);
	}
		
	button.ajax.on_id_change = function(id) {};

	return button;
}

function checkbox_create(parent, state)
{
	const checkbox = generic_create(parent, "button");
	
	/** Change switcher internal state. */
	checkbox.set_state = function(state)
	{
		checkbox.state = state;
		
		if (state) {
			checkbox.style.background = "#113311";
			checkbox.innerHTML = "&#10003";
		} else {
			checkbox.style.background = "#331111";
			checkbox.innerHTML = "&#10007";
		}
	}
	
	checkbox.set_state(state);

	/** custom event. */
	checkbox.on_check = function(state) {}
	
	/** Set ajax event for this checkbox. */
	checkbox.onclick = function()
	{
		checkbox.set_state(!checkbox.state);
		checkbox.on_check(checkbox.state);
		checkbox.ajax.send([checkbox.state ? 1 : 0]);
	}
		
	checkbox.ajax.interval = 5000;
	checkbox.ajax.on_recv = function(args)
	{
		checkbox.set_state(args[0]);
		checkbox.on_check(args[0]);
	}
	
	return checkbox;
}

function field_create(parent, value)
{
	const field = document.createElement("input");
	field.className = "field";
	field.type = "text";
	field.value = value;
	parent.appendChild(field);
	return field;
}

function regulator_create(parent, rmin, rmax, rstep, orient)
{
	const digits = 2;
	const layout = layout_create(parent, "h");
	const decrement = button_create(layout, "<");
	const text = text_create(layout, "");
	const increment = button_create(layout, ">");
	
	layout.style.flexWrap = "nowrap";
	layout.style.flex = "1";
	layout.decrement = decrement;
	layout.text = text;
	layout.increment = increment;
	layout.format = "numeric";
	
	/** custom event. */
	decrement.on_press = function() {}
	increment.on_press = function() {}
	
	layout.check_bounds = function()
	{
		if (layout.value > rmax)
			layout.value = rmax;

		if (layout.value < rmin)
			layout.value = rmin;
	}
	
	layout.set_value = function(val) {
		layout.value = parseFloat(val);
		layout.check_bounds();
		if (layout.format == "percentage")
			layout.text.innerHTML = (layout.value * 100).toFixed(digits) + "%";
		else
			layout.text.innerHTML = layout.value.toFixed(digits);
	};
	
	layout.set_format = function(fmt) {
		layout.format = fmt;
		layout.set_value(layout.value);
	}
	
	/** Set click event for this checkbox. */
	decrement.onclick = function() {
		layout.set_value(layout.value - rstep);
		layout.ajax.send([layout.value.toFixed(digits)]);
		decrement.on_press();
	};
	
	text.onclick = function() {
		const popup = popup_create(document.body, "Ввести значення");

		let mul = (layout.format == 'percentage' ? 100 : 1);

		const field = field_create(popup.content, (layout.value * mul).toFixed(digits));

		field.type = "number";
		field.min = rmin * mul;
		field.max = rmax * mul;
		field.step = rstep * mul;
	
		const button = button_create(popup.content, "Встановити");
		button.on_press = function() {
			layout.set_value(field.value / mul);
			layout.ajax.send([layout.value.toFixed(digits)]);
			popup.remove();
		};
		
		field.onkeydown = function(evt) {
			if (evt.key === "Enter")
				button.on_press();
		}
	};
	
	increment.onclick = function() {
		layout.set_value(layout.value + rstep);
		layout.ajax.send([layout.value.toFixed(digits)]);
		increment.on_press();
	};
	
	increment.ontouchstart = increment.onmousedown = function() {
		/** TODO AUTOINCREMENT. */
		//console.log("touchstart");
	};
	
	layout.ajax.interval = 5000;
	layout.ajax.on_recv = function(args)
	{
		layout.set_value(args[0]);
	}
	
	layout.set_value(rmin);
	return layout;
}

function loading_create(parent)
{
	return generic_create(parent, "lds-dual-ring");
}

/* Initialize hint tool */
const hint = new hint_tool("global");

function register_hint_dialog(parent, text) {

		const popup = popup_create(document.body, "Підказка");

function create_bms_regulator(parent, rmin, rmax, rstep,
			      enabler_id, regulator_value_id, caption)
{
	const subpane = subpane_create(parent, caption);
	subpane.content.style.flexBasis = "33.333333%";
	subpane.content.style.visibility = "hidden";

	subpane.content.regulator = regulator_create(subpane.content, rmin, rmax, rstep);

	/* Do not create enabler toolbar */
	if (enabler_id == -1) {
		subpane.content.regulator.ajax.id = regulator_value_id;
		subpane.content.style.visibility = "";
		return subpane;
	}

	subpane.toolbar.checkbox = checkbox_create(subpane.toolbar, false);
	subpane.toolbar.checkbox.style.padding = "0.1em";
	subpane.toolbar.checkbox.ajax.id = enabler_id;
	subpane.toolbar.checkbox.on_check = function(state)
	{
		if (state) {
			subpane.content.regulator.ajax.id = regulator_value_id;
			subpane.content.style.visibility = "";
		} else {
			subpane.content.regulator.ajax.id = undefined;
			subpane.content.style.visibility = "hidden";
		}
	}
		
	return subpane;
}

function create_kwt_counter(parent)
{
	const pane = subpane_create(parent.content, "Програмний лічильник заряду");
	register_hint_dialog(pane.caption,
		"Даний лічильник рахує залишок ємності автомобіля (пробіг) у " +
		"кіловат-годинах та автоматично розраховує SOC під час руху чи заряджання. " +
		"Вмикайте його, якщо лічильник у самій батареї працює некоректно." +
		"<p style='color: yellow;'>ПРИМІТКА</p>" +
		"Дане налаштування не впливає на реальний пробіг автомобіля, а лише " +
		"використовується для відображення показників пробігу та " +
		"стану заряду. Також зверніть увагу на інші налаштування у " +
		"цій секції.");

	/** Enabler. */
	const enabled = checkbox_create(pane.toolbar, true);
	enabled.ajax.id = ID_BMS_KWT_COUNTER_ENABLED;
	enabled.style.padding = "0.1em";
	enabled.on_check = function(state) {
		pane.content.style.visibility = state ? "" : "hidden";
	}

	/** Set current capacity. */
	const subpane = create_bms_regulator(
		pane.content, 0, 100, 1, -1, ID_BMS_KWT_COUNTER,
		"Встановити поточну ємність(kWh)");
	register_hint_dialog(subpane,
		"Вcтановлення поточної ємності для лічильника дозволяє задати " +
		"орієнтовне значення ємності батареї у кіловат-годинах. Це впливає на " +
		"стрілочні показники залишку пробігу та на дисплей. " +
		"Наприклад 12kWh при повній ємності 24kWt = 50% SOH.<p></p>" +
		"Відношення: (поточна ємність) / (повна ємність) = (стан заряду (SOC) у відсотках)." +
		"<p style='color: yellow;'>ПРИМІТКА</p>" +
		"Повна ємність повинна бути встановлена для коректної роботи лічильника " +
		"та для визначення стану заряду (SOC). " +
		"Значення показника поточної ємності також буде перераховуватися автоматично " +
		"під час їзди, чи під час заряджання.");

	/** Define set_value method for this pane object */
	pane.set_value = subpane.content.regulator.set_value;

	return pane;
}

function create_fake_bms(parent)

		"При перепаковці батареї часто буває що другу (допоміжну) BMS " +
		"не встановлюють і автомобіль може стати у помилку. " +
		"Дане налаштування дозволяє 'відтворити' роботу цієї BMS так, " +
		"що автомобіль не помітить її відсутності. Таким чином пов'язані " +
		"помилки вилікуються.<p style='color: yellow;'>ПРИМІТКА</p>" +
		"Це налаштування не дає ніякого ефекту у випадку, якщо друга BMS " +
		"присутня, і не впливає на роботу другої BMS. Тому " +
		"воно може бути увімкнене весь час по замовчуванню.",

	/** Enabler. */

	enabled.ajax.id = ID_BMS_FAKE_BMS_ENABLED;
	enabled.style.padding = "0.1em";
	enabled.on_check = function(state) {
		pane.content.style.visibility = state ? "" : "hidden";
	}
	
	return pane;
}
